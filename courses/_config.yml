# Jupyter Book configuration for the MindQuantum courses workspace

################################################################################
# Site metadata
################################################################################

title: MindQuantum Courses
description: "系统化的 MindQuantum 量子计算课程"
subtitle: MindQuantum 在线课程
language: zh
only_build_toc_files: true
keywords:
  - MindQuantum
  - 量子计算
  - 课程
  - 教学

################################################################################
# Parsing / execution
################################################################################

parse:
  myst_enable_extensions:
    - deflist
    - colon_fence
    - dollarmath
    - amsmath
    - linkify
execute:
  execute_notebooks: off

################################################################################
# HTML options
################################################################################

html:
  favicon: ../docs/_static/favicon.png
  use_edit_page_button: false
  use_repository_button: false
  use_issues_button: false
  extra_navbar: |
    <a href="../" class="mq-home-link">← 返回首页</a>

launch_buttons:
  thebe: true

theme:
  name: sphinx_book_theme
  logo: ../docs/_static/favicon.png
  options:
    navigation_depth: 2
    show_toc_level: 2
    use_download_button: true
    use_fullscreen_button: false

################################################################################
# Sphinx configuration
################################################################################

sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.autosummary
    - sphinx.ext.napoleon
    - sphinx.ext.mathjax
    - IPython.sphinxext.ipython_console_highlighting
  config:
    author: "MindQuantum Contributors"
    # 课程笔记本沿用经典 Jupyter 的公式写法：允许段落内的 $$...$$ 按块级公式解析
    # （jupyter-book 1.x 的 parse: 段不透传该选项，必须放在 sphinx.config 下）
    myst_dmath_double_inline: true
    # {year} 为年份占位符，构建时由 scripts/update-copyright.mjs 自动替换
    copyright: "{year}, MindQuantum"
    language: zh
    # 自托管 MathJax（由 scripts/prepare-mathjax.mjs 拷贝），避免依赖境外 CDN
    mathjax_path: mathjax/tex-mml-chtml.js
    html_static_path:
      - ../docs/_static
    html_css_files:
      - mq-variables.css
      - mq-theme.css
      - mq-thebe.css
    html_js_files:
      - mq-thebe.js
    thebe_config:
      repository_url: https://github.com/MindQuantum-HiQ/mq-env
      repository_branch: main
      binderhub_url: https://mybinder.org
